name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build (release)
        run: swift build -c release
      - name: Render preview sheet (smoke test)
        run: swift run -c release Mochi --render "$RUNNER_TEMP/preview.png"
      - name: Build app bundle
        run: ./scripts/build-app.sh
